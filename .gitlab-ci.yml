image: node:22

stages:
  - test
  - deploy

cache:
  key:
    files:
      - src/view/package-lock.json
  paths:
    - src/view/.npm/

frontend-check:
  stage: test
  script:
    - cd src/view
    - npm ci --cache .npm --prefer-offline
    - npm run typecheck
    - npm test -- --run src/features/api-contracts.test.ts
  rules:
    - if: $CI_COMMIT_BRANCH

pages:
  stage: deploy
  needs:
    - frontend-check
  script:
    - test -n "$VITE_API_BASE_URL" || (echo "Configure VITE_API_BASE_URL em Settings > CI/CD > Variables apontando para a WebAPI publica, ex. https://api.seudominio.com/api/v1" && exit 1)
    - |
      if [ -z "$VITE_BASE_PATH" ]; then
        if [ "$CI_PROJECT_NAME" = "${CI_PROJECT_ROOT_NAMESPACE}.gitlab.io" ]; then
          export VITE_BASE_PATH="/"
        else
          export VITE_BASE_PATH="/${CI_PROJECT_NAME}/"
        fi
      fi
    - export VITE_ALUNO_BASE_URL="${VITE_ALUNO_BASE_URL:-${CI_PAGES_URL}/aluno/prova}"
    - cd src/view
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - cp dist/index.html dist/404.html
    - cd ../..
    - rm -rf public
    - cp -a src/view/dist public
  artifacts:
    paths:
      - public
  pages: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
